name: Build iPhone Duo IPA (iOS 27.1)
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths: ['project.zip', '.github/workflows/build-ipa.yml', 'overrides/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build unsigned IPA with iOS 27.1 SDK
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack source package
        shell: bash
        run: |
          set -euo pipefail
          test -s project.zip || { echo "::error::Upload project.zip to the repository first"; exit 1; }
          echo '751659dce972e6140ae121917eca88e9f7ba0b9ca0240d4a35bbe39e4ca189c1  project.zip' | shasum -a 256 -c -
          mkdir -p source
          unzip -q project.zip -d source
          test -f source/scripts/build-unsigned-ipa.sh
      - name: Apply native screen updates
        shell: bash
        run: |
          set -euo pipefail
          if test -f overrides/NativeScreens.swift; then
            cp overrides/NativeScreens.swift source/EStaffingTimeCard/NativeScreens.swift
          fi
          if test -f overrides/TimeCardView.swift; then
            cp overrides/TimeCardView.swift source/EStaffingTimeCard/TimeCardView.swift
          fi
          if test -f overrides/native-form-bridge.js; then
            cp overrides/native-form-bridge.js source/EStaffingTimeCard/Resources/native-form-bridge.js
          fi
          if test -d overrides/tests; then
            cp overrides/tests/*.cjs source/tests/
          fi
          python3 overrides/apply_version.py
          echo "APP_VERSION=$(cat overrides/VERSION)" >> "$GITHUB_ENV"
      - name: Select Xcode 27.1
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_27.1.app/Contents/Developer
          test -d "$DEVELOPER_DIR" || { echo "::error::Xcode 27.1 not found"; exit 1; }
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $version"
          test "$version" = 27.1 || { echo "::error::Expected iOS 27.1 SDK"; exit 1; }
      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in source/EStaffingTimeCard/Resources/*.js; do node --check "$file"; done
      - name: Test break-time autofill
        shell: bash
        run: node source/tests/break-autofill.test.cjs
      - name: Test native Duo navigation
        shell: bash
        run: cd source && node tests/native-navigation.test.cjs
      - name: Test productivity features
        shell: bash
        run: cd source && node tests/productivity-contract.test.cjs
      - name: Test navigation and dashboard refresh
        shell: bash
        run: cd source && node tests/navigation-regression.test.cjs && node tests/dashboard-refresh.test.cjs
      - name: Test daily overtime calculations
        shell: bash
        run: cd source && node tests/overtime-dashboard.test.cjs
      - name: Test monthly dashboard and loading
        shell: bash
        run: cd source && node tests/monthly-dashboard.test.cjs
      - name: Test holidays and read-only Duo calendar
        shell: bash
        run: cd source && node tests/holiday-duo-readonly.test.cjs
      - name: Test salary settings and calendar routing
        shell: bash
        run: cd source && node tests/salary-calendar.test.cjs
      - name: Test payroll and native time routing
        shell: bash
        run: cd source && node tests/payroll-time-routing.test.cjs
      - name: Test compact picker and now buttons
        shell: bash
        run: cd source && node tests/compact-time-now.test.cjs
      - name: Test native forms and autosave
        shell: bash
        run: cd source && node tests/native-form-autosave.test.cjs
      - name: Test adaptive closing and break guidance
        shell: bash
        run: cd source && node tests/native-adaptive-closing.test.cjs
      - name: Test native settings and full calendar
        shell: bash
        run: cd source && node tests/native-settings-calendar-v32.test.cjs
      - name: Test shift forecast (Swift) and UI
        shell: bash
        run: |
          cd source
          swiftc EStaffingTimeCard/ShiftEndForecast.swift tests/shift-forecast.swift -o /tmp/shift-forecast-test
          /tmp/shift-forecast-test
          if test -f tests/shift-forecast-v35.test.cjs; then node tests/shift-forecast-v35.test.cjs; else node tests/shift-forecast-ui.test.cjs; fi
      - name: Test simplified native workflows
        shell: bash
        run: cd source && if test -f tests/native-compact-v35.test.cjs; then node tests/native-compact-v35.test.cjs; else node tests/native-compact-v34.test.cjs; fi
      - name: Test iPhone Duo half-fold layouts and version
        shell: bash
        run: cd source && node tests/native-duo-fold-v35.test.cjs
      - name: Test tabletop layout polish (v3.6)
        shell: bash
        run: cd source && node tests/tabletop-polish-v36.test.cjs
      - name: Test native daily and closing applications (v3.7)
        shell: bash
        run: cd source && node tests/native-submission-v37.test.cjs
      - name: Test approved read-only attendance and leave labels (v3.8)
        shell: bash
        run: cd source && node tests/approved-readonly-v38.test.cjs
      - name: Test e-staffing native session recovery (v3.9)
        shell: bash
        run: cd source && node tests/native-session-recovery-v39.test.cjs
      - name: Test Duo sidebar first-week calendar (v3.10)
        shell: bash
        run: cd source && node tests/sidebar-calendar-v310.test.cjs
      - name: Build unsigned IPA
        shell: bash
        run: cd source && bash scripts/build-unsigned-ipa.sh
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EStaffingTimeCard-Duo-v${{ env.APP_VERSION }}-iOS27.1-unsigned
          path: source/BuildOutput/EStaffingTimeCard-Duo-iOS27.1-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Publish IPA for direct download
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Downloads
          cp source/BuildOutput/EStaffingTimeCard-Duo-iOS27.1-unsigned.ipa "Downloads/EStaffingDuo_v${APP_VERSION//./_}.ipa"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Downloads/EStaffingDuo_v${APP_VERSION//./_}.ipa"
          if git diff --cached --quiet; then
            echo "IPA already up to date"
          else
            git commit -m "Publish Duo unsigned IPA v${APP_VERSION}"
            git push origin HEAD:main
          fi
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: source/BuildOutput/build.log
          if-no-files-found: ignore
