name: Build iPhone Duo IPA (iOS 27.1)
on:
  push:
    branches: [main]
    paths: ['project.zip', '.github/workflows/build-ipa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build unsigned IPA with iOS 27.1 SDK
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack source package
        shell: bash
        run: |
          set -euo pipefail
          test -s project.zip || { echo "::error::Upload project.zip to the repository first"; exit 1; }
          echo '654b8b267efb9c2c351d4ad0ea81cfc331faac6e23ac67a4debf4b757a98848e  project.zip' | shasum -a 256 -c -
          mkdir -p source
          unzip -q project.zip -d source
          test -f source/scripts/build-unsigned-ipa.sh
      - name: Select Xcode 27.1
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_27.1.app/Contents/Developer
          test -d "$DEVELOPER_DIR" || { echo "::error::Xcode 27.1 not found"; exit 1; }
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $version"
          test "$version" = 27.1 || { echo "::error::Expected iOS 27.1 SDK"; exit 1; }
      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in source/EStaffingTimeCard/Resources/*.js; do node --check "$file"; done
      - name: Test break-time autofill
        shell: bash
        run: node source/tests/break-autofill.test.cjs
      - name: Test native Duo navigation
        shell: bash
        run: cd source && node tests/native-navigation.test.cjs
      - name: Test productivity features
        shell: bash
        run: cd source && node tests/productivity-contract.test.cjs
      - name: Test navigation and dashboard refresh
        shell: bash
        run: cd source && node tests/navigation-regression.test.cjs && node tests/dashboard-refresh.test.cjs
      - name: Test daily overtime calculations
        shell: bash
        run: cd source && node tests/overtime-dashboard.test.cjs
      - name: Test monthly dashboard and loading
        shell: bash
        run: cd source && node tests/monthly-dashboard.test.cjs
      - name: Test holidays and read-only Duo calendar
        shell: bash
        run: cd source && node tests/holiday-duo-readonly.test.cjs
      - name: Test salary settings and calendar routing
        shell: bash
        run: cd source && node tests/salary-calendar.test.cjs
      - name: Test payroll and native time routing
        shell: bash
        run: cd source && node tests/payroll-time-routing.test.cjs
      - name: Test compact picker and now buttons
        shell: bash
        run: cd source && node tests/compact-time-now.test.cjs
      - name: Test native forms and autosave
        shell: bash
        run: cd source && node tests/native-form-autosave.test.cjs
      - name: Build unsigned IPA
        shell: bash
        run: cd source && bash scripts/build-unsigned-ipa.sh
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EStaffingTimeCard-Duo-v3.0-iOS27.1-unsigned
          path: source/BuildOutput/EStaffingTimeCard-Duo-iOS27.1-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: source/BuildOutput/build.log
          if-no-files-found: ignore
